<svg xmlns="http://www.w3.org/2000/svg" width="760" height="510" viewBox="0 0 760 510" xml:space="preserve">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 14px; fill: #4c4f69; white-space: pre; }
    .t { fill: #7c7f93; font-size: 13px; }
    .p { fill: #8839ef; }
    .k { fill: #1e66f5; }
    .d { fill: #7c7f93; }
    .y { fill: #8839ef; }
    .s { fill: #40a02b; }
    .r { fill: #d20f39; }
    .l { animation: in .2s ease-out both; }
    .cover { animation: type 1.4s steps(26) .4s both; }
    .cur { animation: blink 1s steps(1) infinite; }
    @keyframes in { from { opacity: 0; } }
    @keyframes type {
      0% { opacity: 1; transform: translateX(0); }
      99.9% { opacity: 1; transform: translateX(218.4px); }
      100% { opacity: 0; transform: translateX(218.4px); }
    }
    @keyframes blink { 50% { opacity: 0; } }
    /* finished frame is the default state, so reduced motion shows everything at once */
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect x=".5" y=".5" width="759" height="509" rx="10" fill="#eff1f5" stroke="#ccd0da"/>
  <path d="M1 36V10.5A9.5 9.5 0 0 1 10.5 1H749.5A9.5 9.5 0 0 1 759 10.5V36Z" fill="#e6e9ef"/>
  <line x1="1" y1="36.5" x2="759" y2="36.5" stroke="#ccd0da"/>
  <circle cx="20" cy="18" r="6" fill="#d20f39"/>
  <circle cx="40" cy="18" r="6" fill="#df8e1d"/>
  <circle cx="60" cy="18" r="6" fill="#40a02b"/>
  <text x="380" y="23" text-anchor="middle" class="t">martin@prague: ~</text>

  <text x="24" y="66"><tspan class="p">$</tspan> kubectl get martin -o yaml</text>
  <!-- slides right one char per step to "type" the command -->
  <g class="cover" opacity="0">
    <rect x="40.8" y="51" width="240" height="20" fill="#eff1f5"/>
    <rect x="40.8" y="53" width="8.4" height="17" fill="#4c4f69"/>
  </g>

  <text x="24" y="86" class="l" style="animation-delay:2s"><tspan class="k">apiVersion</tspan><tspan class="d">:</tspan> humans.kutlak.cc/v1</text>
  <text x="24" y="106" class="l" style="animation-delay:2.06s"><tspan class="k">kind</tspan><tspan class="d">:</tspan> <tspan class="y">DevOpsEngineer</tspan></text>
  <text x="24" y="126" class="l" style="animation-delay:2.12s"><tspan class="k">metadata</tspan><tspan class="d">:</tspan></text>
  <text x="24" y="146" class="l" style="animation-delay:2.18s">  <tspan class="k">name</tspan><tspan class="d">:</tspan> martin</text>
  <text x="24" y="166" class="l" style="animation-delay:2.24s">  <tspan class="k">namespace</tspan><tspan class="d">:</tspan> prague-cz</text>
  <text x="24" y="186" class="l" style="animation-delay:2.3s">  <tspan class="k">labels</tspan><tspan class="d">:</tspan></text>
  <text x="24" y="206" class="l" style="animation-delay:2.36s">    <tspan class="k">mode</tspan><tspan class="d">:</tspan> head-in-the-clouds</text>
  <text x="24" y="226" class="l" style="animation-delay:2.42s"><tspan class="k">spec</tspan><tspan class="d">:</tspan></text>
  <text x="24" y="246" class="l" style="animation-delay:2.48s">  <tspan class="k">stack</tspan><tspan class="d">: [</tspan>go<tspan class="d">,</tspan> kubernetes<tspan class="d">,</tspan> opentofu<tspan class="d">,</tspan> argocd<tspan class="d">]</tspan></text>
  <text x="24" y="266" class="l" style="animation-delay:2.54s">  <tspan class="k">building</tspan><tspan class="d">:</tspan></text>
  <text x="24" y="286" class="l" style="animation-delay:2.6s">    <tspan class="d">-</tspan> airworthy</text>
  <text x="24" y="306" class="l" style="animation-delay:2.66s">    <tspan class="d">-</tspan> pull-hero</text>
  <text x="24" y="326" class="l" style="animation-delay:2.72s"><tspan class="k">status</tspan><tspan class="d">:</tspan></text>
  <text x="24" y="346" class="l" style="animation-delay:2.78s">  <tspan class="k">phase</tspan><tspan class="d">:</tspan> <tspan class="s">Running</tspan></text>
  <text x="24" y="366" class="l" style="animation-delay:2.84s">  <tspan class="k">conditions</tspan><tspan class="d">:</tspan></text>
  <text x="24" y="386" class="l" style="animation-delay:2.9s">    <tspan class="d">-</tspan> <tspan class="k">type</tspan><tspan class="d">:</tspan> Exploring</text>
  <text x="24" y="406" class="l" style="animation-delay:2.96s">      <tspan class="k">status</tspan><tspan class="d">:</tspan> <tspan class="s">"False"</tspan></text>
  <text x="24" y="426" class="l" style="animation-delay:3.02s">    <tspan class="d">-</tspan> <tspan class="k">type</tspan><tspan class="d">:</tspan> Lost</text>
  <text x="24" y="446" class="l" style="animation-delay:3.08s">      <tspan class="k">status</tspan><tspan class="d">:</tspan> <tspan class="r">"True"</tspan></text>
  <text x="24" y="466" class="l" style="animation-delay:3.14s">      <tspan class="k">reason</tspan><tspan class="d">:</tspan> <tspan class="r">AlwaysLost</tspan></text>

  <g class="l" style="animation-delay:3.34s">
    <text x="24" y="486"><tspan class="p">$</tspan></text>
    <rect class="cur" x="40.8" y="473" width="8.4" height="17" fill="#4c4f69"/>
  </g>
</svg>
